name: Réveil de la base

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Interroger la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_zGhJYqpSBhaKhVU0d3xyqg_rfBOBEEn" \
            "https://lpuifsnlzlkeyrxidkyj.supabase.co/rest/v1/equipiers?select=id&limit=1")
          echo "Réponse de la base : HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::La base n'a pas répondu correctement (HTTP $code)."
            exit 1
          fi

      - name: Noter la date du dernier réveil
        run: |
          date -u +"Dernier réveil de la base : %Y-%m-%d %H:%M UTC" > dernier-reveil.txt
          git config user.name "Réveil automatique"
          git config user.email "actions@users.noreply.github.com"
          git add dernier-reveil.txt
          git commit -m "Réveil de la base $(date -u +%Y-%m-%d)" || exit 0
          git push
